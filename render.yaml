services:
  - type: web
    name: one-last-flower
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: node server.mjs
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: GAME_DB_PATH
        value: /var/data/meeting-dates.sqlite
      - key: ADMIN_KEY
        generateValue: true
    disk:
      name: flower-data
      mountPath: /var/data
      sizeGB: 1
